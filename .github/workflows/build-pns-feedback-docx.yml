name: Build PNS feedback DOCX files

on:
  push:
    paths:
      - 'PNS/Proposal_July_2026/_feedback_build_marker.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DOCX dependency
        run: python -m pip install --quiet python-docx

      - name: Generate Word feedback files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Pt, Inches, RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml.ns import qn

          root = Path("PNS/Proposal_July_2026")
          src = root / "_feedback_source"
          out = root / "Feedback"
          out.mkdir(parents=True, exist_ok=True)

          def set_font(run, name="Aptos", size=10.5, bold=None, italic=None, color=None):
              run.font.name = name
              run._element.get_or_add_rPr().rFonts.set(qn("w:ascii"), name)
              run._element.get_or_add_rPr().rFonts.set(qn("w:hAnsi"), name)
              run.font.size = Pt(size)
              if bold is not None:
                  run.bold = bold
              if italic is not None:
                  run.italic = italic
              if color is not None:
                  run.font.color.rgb = RGBColor(*color)

          def add_heading(doc, text):
              p = doc.add_paragraph()
              p.style = doc.styles["Heading 1"]
              p.paragraph_format.space_before = Pt(7)
              p.paragraph_format.space_after = Pt(2)
              r = p.add_run(text)
              set_font(r, name="Aptos Display", size=12, bold=True, color=(31,78,121))
              return p

          def add_body(doc, text, bold=False):
              p = doc.add_paragraph()
              p.paragraph_format.space_after = Pt(5)
              p.paragraph_format.line_spacing = 1.05
              r = p.add_run(text)
              set_font(r, size=10.5, bold=bold)
              return p

          def add_bullet(doc, text):
              p = doc.add_paragraph(style="List Bullet")
              p.paragraph_format.left_indent = Inches(0.22)
              p.paragraph_format.first_line_indent = Inches(-0.12)
              p.paragraph_format.space_after = Pt(2)
              r = p.add_run(text)
              set_font(r, size=10.5)
              return p

          for md_path in sorted(src.glob("Participant_*_Feedback.md")):
              lines = md_path.read_text(encoding="utf-8").splitlines()
              doc = Document()
              sec = doc.sections[0]
              sec.top_margin = Inches(0.65)
              sec.bottom_margin = Inches(0.65)
              sec.left_margin = Inches(0.75)
              sec.right_margin = Inches(0.75)

              styles = doc.styles
              styles["Normal"].font.name = "Aptos"
              styles["Normal"]._element.rPr.rFonts.set(qn("w:ascii"), "Aptos")
              styles["Normal"]._element.rPr.rFonts.set(qn("w:hAnsi"), "Aptos")
              styles["Normal"].font.size = Pt(10.5)
              styles["Heading 1"].font.name = "Aptos Display"
              styles["Heading 1"].font.size = Pt(12)

              first = True
              second = True
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  if not line:
                      i += 1
                      continue

                  if first and line.startswith("**") and line.endswith("**"):
                      p = doc.add_paragraph()
                      p.paragraph_format.space_after = Pt(1)
                      r = p.add_run(line[2:-2])
                      set_font(r, name="Aptos Display", size=15, bold=True, color=(31,78,121))
                      first = False
                      i += 1
                      continue

                  if second and line.startswith("*") and line.endswith("*") and not line.startswith("**"):
                      p = doc.add_paragraph()
                      p.paragraph_format.space_after = Pt(6)
                      r = p.add_run(line[1:-1])
                      set_font(r, size=10.5, bold=True)
                      second = False
                      i += 1
                      continue

                  if line.startswith("## "):
                      add_heading(doc, line[3:])
                  elif line.startswith("- "):
                      add_bullet(doc, line[2:])
                  elif line.startswith("Academic grade before word-count penalty") or line.startswith("Word-count penalty") or line.startswith("Final grade"):
                      # Keep the penalty display compact in one paragraph with line breaks.
                      penalty = []
                      while i < len(lines):
                          t = lines[i].strip()
                          if not t or t.startswith("## ") or t.startswith("- "):
                              break
                          if t.startswith("Academic grade before word-count penalty") or t.startswith("Word-count penalty") or t.startswith("Final grade"):
                              penalty.append(t)
                              i += 1
                          else:
                              break
                      p = doc.add_paragraph()
                      p.paragraph_format.space_after = Pt(4)
                      for t in penalty:
                          r = p.add_run(t + "\n")
                          set_font(r, size=10.5, bold=t.startswith("Final grade"))
                      continue
                  else:
                      add_body(doc, line)
                  i += 1

              footer = sec.footer
              fp = footer.paragraphs[0]
              fp.alignment = WD_ALIGN_PARAGRAPH.CENTER
              fr = fp.add_run("Psychobiology & Neuroscience | Research Proposal Feedback | July 2026")
              set_font(fr, size=8)

              docx_name = md_path.name.replace(".md", ".docx")
              doc.save(out / docx_name)

          expected = 14
          created = list(out.glob("Participant_*_Feedback.docx"))
          if len(created) != expected:
              raise RuntimeError(f"Expected {expected} feedback DOCX files, created {len(created)}")
          PY

      - name: Remove one-off build inputs
        shell: bash
        run: |
          rm -rf "PNS/Proposal_July_2026/_feedback_source"
          rm -f "PNS/Proposal_July_2026/_feedback_build_marker.txt"
          rm -f "PNS/Proposal_July_2026/_feedback_bundle.zip"
          rm -f ".github/workflows/unpack-pns-feedback.yml"
          rm -f ".github/workflows/build-pns-feedback-docx.yml"

      - name: Commit feedback documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PNS July 2026 student feedback documents"
          git push
