name: Unzip PNS July 2026 proposals

on:
  push:
    paths:
      - '.github/workflows/unzip-pns-july-2026.yml'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract proposal submissions safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          repo = Path.cwd().resolve()
          target = repo / "PNS" / "Proposal_July_2026"
          archive = target / "PN_PPSY7E July 2026-Research Proposal Report-1388168.zip"
          staging = repo / ".tmp_pns_extract"

          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)

          with ZipFile(archive) as zf:
              for member in zf.infolist():
                  raw = member.filename.replace("\\", "/")
                  parts = [p for p in Path(raw).parts if p not in ("", ".")]
                  if not parts or any(p == ".." for p in parts):
                      raise RuntimeError(f"Unsafe ZIP member: {member.filename}")
                  dest = (staging / Path(*parts)).resolve()
                  if staging not in dest.parents and dest != staging:
                      raise RuntimeError(f"ZIP path escapes staging directory: {member.filename}")
                  if member.is_dir():
                      dest.mkdir(parents=True, exist_ok=True)
                  else:
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(member) as src, open(dest, "wb") as out:
                          shutil.copyfileobj(src, out)

          for src in staging.rglob("*"):
              rel = src.relative_to(staging)
              if "__MACOSX" in rel.parts or src.name == ".DS_Store":
                  continue
              dst = target / rel
              if src.is_dir():
                  dst.mkdir(parents=True, exist_ok=True)
              else:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

          shutil.rmtree(staging)
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PNS/Proposal_July_2026"
          if git diff --cached --quiet; then
            echo "No new extracted files to commit."
          else
            git commit -m "Extract PNS July 2026 proposal submissions"
            git push
          fi

# one-off extraction workflow
