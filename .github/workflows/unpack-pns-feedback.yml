name: Unpack PNS feedback documents

on:
  push:
    paths:
      - 'PNS/Proposal_July_2026/_feedback_bundle.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack feedback documents
        shell: bash
        run: |
          set -e
          mkdir -p "PNS/Proposal_July_2026/Feedback"
          unzip -o "PNS/Proposal_July_2026/_feedback_bundle.zip" -d "PNS/Proposal_July_2026/Feedback"
          rm "PNS/Proposal_July_2026/_feedback_bundle.zip"
          rm ".github/workflows/unpack-pns-feedback.yml"

      - name: Commit feedback documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add "PNS/Proposal_July_2026/Feedback" "PNS/Proposal_July_2026/_feedback_bundle.zip" ".github/workflows/unpack-pns-feedback.yml" || true
          git commit -m "Add PNS July 2026 student feedback documents"
          git push
